version: 2
updates:
  # Runtime dependencies of the plugin (vendored, so the update must refresh
  # vendor/ as well: run `make vendor` after merging).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      go-modules:
        patterns: ["*"]

  # The Yaegi compatibility check lives in its own module.
  - package-ecosystem: gomod
    directory: /tools/yaegicheck
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      yaegicheck:
        patterns: ["*"]
    # The check must load the plugin with the same interpreter Traefik ships
    # (v3.5 uses Yaegi 0.16.1): the version is bumped by hand with Traefik.
    ignore:
      - dependency-name: github.com/traefik/yaegi

  # Keep the GitHub Actions of the workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
