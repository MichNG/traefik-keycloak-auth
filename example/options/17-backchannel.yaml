# Back-channel logout endpoint
#
# Options covered: backchannelLogoutUrl, backchannelLogoutSessionsRequired
# Loaded by the "options" end-to-end check (docker/e2e-options.sh) into a real
# Traefik, so this file must stay a valid dynamic configuration.

http:
  middlewares:
    backchannel:
      plugin:
        traefik-keycloak-auth:
          issuer: "https://keycloak.example.com/realms/myrealm"
          redirectUrl: "/callback"
          clientID: "traefik"
          clientSecret: "${CLIENT_SECRET}"
          secret: "0123456789abcdef0123456789abcdef"
          backchannelLogoutUrl: "/backchannel-logout"
          backchannelLogoutSessionsRequired: true
          session:
            store:
              redis:
                endpoints: ["redis:6379"]
  routers:
    backchannel:
      rule: "PathPrefix(`/backchannel`)"
      middlewares: ["backchannel"]
      service: noop@internal
