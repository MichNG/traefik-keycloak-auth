# Token validation modes and proactive refresh
#
# Options covered: tokenValidation, tokenRenewalThreshold, useClaimsFromUserInfo
# Loaded by the "options" end-to-end check (docker/e2e-options.sh) into a real
# Traefik, so this file must stay a valid dynamic configuration.

http:
  middlewares:
    tv-access-token:
      plugin:
        traefik-keycloak-auth:
          issuer: "https://keycloak.example.com/realms/myrealm"
          redirectUrl: "/callback"
          clientID: "traefik"
          clientSecret: "${CLIENT_SECRET}"
          secret: "0123456789abcdef0123456789abcdef"
          # extension: verify the access token instead of the ID token
          tokenValidation: "AccessToken"
          tokenRenewalThreshold: 0.75
          useClaimsFromUserInfo: false
    tv-introspection:
      plugin:
        traefik-keycloak-auth:
          issuer: "https://keycloak.example.com/realms/myrealm"
          redirectUrl: "/callback"
          clientID: "traefik"
          clientSecret: "${CLIENT_SECRET}"
          secret: "0123456789abcdef0123456789abcdef"
          # variant: ask the provider (RFC 7662) on every request
          tokenValidation: "Introspection"
          useClaimsFromUserInfo: true
  routers:
    tv-access-token:
      rule: "PathPrefix(`/tv-access-token`)"
      middlewares: ["tv-access-token"]
      service: noop@internal
    tv-introspection:
      rule: "PathPrefix(`/tv-introspection`)"
      middlewares: ["tv-introspection"]
      service: noop@internal
