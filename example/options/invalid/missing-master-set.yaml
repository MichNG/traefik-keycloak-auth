# Sentinel configured without masterSet
#
# This file MUST be rejected. Option covered: session.store.redis.sentinel.masterSet
# docker/e2e-options.sh loads it alone into Traefik and asserts the error.

http:
  middlewares:
    missing-master-set:
      plugin:
        traefik-keycloak-auth:
          issuer: "https://keycloak.example.com/realms/myrealm"
          redirectUrl: "/callback"
          clientID: "traefik"
          clientSecret: "LQslcjK8ZeRrrhW7jKaFUUous9W5QvCr"
          secret: "0123456789abcdef0123456789abcdef"
          session:
            store:
              redis:
                endpoints: ["sentinel-0:26379"]
                sentinel:
                  username: "sentinel"
  routers:
    missing-master-set:
      rule: "PathPrefix(`/missing-master-set`)"
      middlewares: ["missing-master-set"]
      service: noop@internal

