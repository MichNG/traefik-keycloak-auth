# mTLS to Redis with cert but no key
#
# This file MUST be rejected. Option covered: session.store.redis.tls.{cert,key}
# docker/e2e-options.sh loads it alone into Traefik and asserts the error.

http:
  middlewares:
    store-cert-without-key:
      plugin:
        traefik-keycloak-auth:
          issuer: "https://keycloak.example.com/realms/myrealm"
          redirectUrl: "/callback"
          clientID: "traefik"
          clientSecret: "LQslcjK8ZeRrrhW7jKaFUUous9W5QvCr"
          secret: "0123456789abcdef0123456789abcdef"
          session:
            store:
              redis:
                endpoints: ["redis:6379"]
                tls:
                  cert: "/tls/client.crt"
  routers:
    store-cert-without-key:
      rule: "PathPrefix(`/store-cert-without-key`)"
      middlewares: ["store-cert-without-key"]
      service: noop@internal

