# A non-positive session expiry
#
# This file MUST be rejected. Option covered: session.expiry
# docker/e2e-options.sh loads it alone into Traefik and asserts the error.

http:
  middlewares:
    bad-expiry:
      plugin:
        traefik-keycloak-auth:
          issuer: "https://keycloak.example.com/realms/myrealm"
          redirectUrl: "/callback"
          clientID: "traefik"
          clientSecret: "LQslcjK8ZeRrrhW7jKaFUUous9W5QvCr"
          secret: "0123456789abcdef0123456789abcdef"
          session:
            expiry: -1
  routers:
    bad-expiry:
      rule: "PathPrefix(`/bad-expiry`)"
      middlewares: ["bad-expiry"]
      service: noop@internal

