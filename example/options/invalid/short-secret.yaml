# The secret must be exactly 32 characters long
#
# This file MUST be rejected. Option covered: secret
# docker/e2e-options.sh loads it alone into Traefik and asserts the error.

http:
  middlewares:
    short-secret:
      plugin:
        traefik-keycloak-auth:
          issuer: "https://keycloak.example.com/realms/myrealm"
          redirectUrl: "/callback"
          clientID: "traefik"
          clientSecret: "LQslcjK8ZeRrrhW7jKaFUUous9W5QvCr"
          secret: "too-short"
  routers:
    short-secret:
      rule: "PathPrefix(`/short-secret`)"
      middlewares: ["short-secret"]
      service: noop@internal
