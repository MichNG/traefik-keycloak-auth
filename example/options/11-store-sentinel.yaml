# Redis Sentinel store (master set, Sentinel credentials)
#
# Options covered: session.store.redis.sentinel.{masterSet,username,password}
# Loaded by the "options" end-to-end check (docker/e2e-options.sh) into a real
# Traefik, so this file must stay a valid dynamic configuration.

http:
  middlewares:
    sentinel:
      plugin:
        traefik-keycloak-auth:
          issuer: "https://keycloak.example.com/realms/myrealm"
          redirectUrl: "/callback"
          clientID: "traefik"
          clientSecret: "${CLIENT_SECRET}"
          secret: "0123456789abcdef0123456789abcdef"
          session:
            store:
              redis:
                endpoints: ["sentinel-0:26379", "sentinel-1:26379", "sentinel-2:26379"]
                username: "${REDIS_USERNAME}"
                password: "${REDIS_PASSWORD}"
                sentinel:
                  masterSet: "mymaster"
                  # the Sentinel credentials may differ from the data-plane ones
                  username: "${SENTINEL_USERNAME}"
                  password: "${SENTINEL_PASSWORD}"
  routers:
    sentinel:
      rule: "PathPrefix(`/sentinel`)"
      middlewares: ["sentinel"]
      service: noop@internal
