# Dynamic configuration of the Sentinel+TLS end-to-end test.
#
# Same middleware set as the plain test, but the sessions are stored in a Redis
# master/replica (and discovered through Sentinels) that only accept TLS
# connections with a client certificate. `oidc-redis-badcreds` points at the
# same store with a wrong password: it must fail closed with a 503 and a
# readable error message in the Traefik log (never "%!w(...)").
http:
  services:
    whoami:
      loadBalancer:
        servers:
          - url: http://whoami:80

  middlewares:
    oidc-redis:
      plugin:
        traefik-keycloak-auth:
          logLevel: DEBUG
          secret: "0123456789abcdef0123456789abcdef"
          issuer: "http://keycloak:8080/realms/myrealm"
          redirectUrl: "/callback"
          clientID: "traefik"
          clientSecret: "LQslcjK8ZeRrrhW7jKaFUUous9W5QvCr"
          scopes: ["openid", "profile", "email"]
          pkce: true
          usernameClaim: preferred_username
          forwardHeaders:
            X-Auth-User: preferred_username
            X-Auth-Roles: realm_access.roles
          forwardIDTokenHeader: "X-Id-Token"
          forwardAccessToken: true
          claims: "OneOf(`access_token.realm_access.roles`, `admin`)"
          loginUrl: "/login"
          logoutUrl: "/logout"
          postLoginRedirectUrl: "/"
          postLogoutRedirectUrl: "/"
          backchannelLogoutUrl: "/backchannel-logout"
          backchannelLogoutSessionsRequired: true
          stateCookie:
            name: "toa-state"
          store:
            keyPrefix: "toa:"
          session:
            name: "toa-session"
            expiry: 3600
            sliding: true
            refresh: true
            store:
              redis:
                endpoints:
                  - sentinel-0:26379
                  - sentinel-1:26379
                  - sentinel-2:26379
                sentinel:
                  masterSet: mymaster
                tls:
                  caBundle: "/tls/ca.crt"
                  cert: "/tls/client.crt"
                  key: "/tls/client.key"
          csrf:
            headerName: "Hub-Csrf-Token"
            secure: false

    oidc-cookie:
      plugin:
        traefik-keycloak-auth:
          logLevel: DEBUG
          secret: "0123456789abcdef0123456789abcdef"
          issuer: "http://keycloak:8080/realms/myrealm"
          redirectUrl: "/cookie/callback"
          clientID: "traefik"
          clientSecret: "LQslcjK8ZeRrrhW7jKaFUUous9W5QvCr"
          scopes: ["openid", "profile", "email"]
          usernameClaim: preferred_username
          loginUrl: "/cookie/login"

    oidc-redis-badcreds:
      plugin:
        traefik-keycloak-auth:
          logLevel: DEBUG
          secret: "0123456789abcdef0123456789abcdef"
          issuer: "http://keycloak:8080/realms/myrealm"
          redirectUrl: "/badcreds/callback"
          clientID: "traefik"
          clientSecret: "LQslcjK8ZeRrrhW7jKaFUUous9W5QvCr"
          session:
            name: "toa-session"
            store:
              redis:
                endpoints:
                  - sentinel-0:26379
                  - sentinel-1:26379
                  - sentinel-2:26379
                sentinel:
                  masterSet: mymaster
                  password: "wrong-password"
                tls:
                  caBundle: "/tls/ca.crt"
                  cert: "/tls/client.crt"
                  key: "/tls/client.key"

  routers:
    whoami-cookie:
      entryPoints: ["web"]
      rule: "PathPrefix(`/cookie`)"
      priority: 100
      service: whoami
      middlewares: ["oidc-cookie"]

    whoami-badcreds:
      entryPoints: ["web"]
      rule: "PathPrefix(`/badcreds`)"
      priority: 200
      service: whoami
      middlewares: ["oidc-redis-badcreds"]

    whoami:
      entryPoints: ["web"]
      rule: "PathPrefix(`/`)"
      priority: 1
      service: whoami
      middlewares: ["oidc-redis"]
